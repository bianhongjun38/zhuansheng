name: Build APK

# 触发：
#   push 到 main    → 自动构建 + 上传产物（Actions 页可下载，留 90 天）
#   手动运行         → 同上
#   打 tag v1.2.0   → 额外发 Release（手机直接在 Release 页点下载）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 默认 token 是只读的，发 Release 需要写权限。
# 不写这一段，tag 构建会在「发 Release」步骤报 403 Resource not accessible by integration。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 还原签名密钥
        # 密钥存仓库 Secrets（KEYSTORE_BASE64），永不进代码库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          ls -l keystore/release.keystore

      - name: 检查是否需要本地构建
        id: guard
        # ⚠ 2026-10-31 起，GitHub CI **不再负责出正式安装包**。
        #
        # 原因：词图并进 App 后，构建需要 ielts-atlas/dist（30,342 个文件、
        # 441.7 MB 媒体），它不在这个仓库里（.gitignore 排除，否则仓库会被
        # 撑爆）。CI runner 上根本没有它，build_apk.py 会 sys.exit(1)。
        #
        # 更糟的是：这次实测到 v1.5.45 的 tag 曾指向旧 commit，
        # CI 用旧 version.json 构建出了 3.66 MB 的**空壳包**并发布了
        # Release —— 版本号写着 1.5.45、包里没有词图、文件名还是
        # zhuansheng-v1.5.44.apk。用户装上去等于没升级。
        #
        # 所以：正式包一律本地构建 + 本地上传（发版pages.py 会走
        # GitHub REST 传 447 MB 资产）。CI 只做「代码能编译、测试能过」
        # 的守门，不再产 Release。
        run: |
          if [ -d "ielts-atlas/dist" ] || [ -d "../ielts-atlas/dist" ]; then
            echo "有词图源码，可以完整构建"
            echo "build=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::没有 ielts-atlas/dist，跳过正式构建（正式包走本地发布）"
            echo "build=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 APK（仅在词图源码存在时）
        if: steps.guard.outputs.build == '1'
        env:
          JAVA_TOOL_OPTIONS: '-Duser.language=en -Duser.country=US'
        # 不用 --bump：版本号以仓库里的 version.json 为准。
        # --bump 只在内存里 +1、不写回文件，CI 又不提交，
        # 会导致每次 tag 构建都产出同一个 versionCode，升级检测失准。
        # 正确做法：本地 bump 并提交，再打 tag。
        run: python build_apk.py

      - name: 跑全部测试与检查
        if: steps.guard.outputs.build == '1'
        env:
          JAVA_TOOL_OPTIONS: '-Duser.language=en -Duser.country=US'
        # 把 verify 的输出同时落到文件。失败时用 ::error:: 打出来，
        # 这样在 Actions 的 annotation 里能直接看到是哪一项挂了 ——
        # 日志下载接口需要鉴权，annotation 是公开可读的。
        run: |
          set +e
          python verify.py 2>&1 | tee verify.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::verify.py 退出码 $rc"
            grep -n "✗" verify.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 verify.log | while IFS= read -r line; do
              echo "::error::tail| $line"
            done
            exit 1
          fi

      - name: 读版本号
        id: ver
        run: |
          CODE=$(python -c "import json;print(json.load(open('version.json'))['versionCode'])")
          NAME=$(python -c "import json;print(json.load(open('version.json'))['versionName'])")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "版本: $NAME (code $CODE)"

      - name: 上传产物（Actions 页可下载）
        if: steps.guard.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: zhuansheng-v${{ steps.ver.outputs.name }}-c${{ steps.ver.outputs.code }}
          path: build/*.apk
          retention-days: 90


      # Release 附件是**累加**语义：softprops/action-gh-release 碰到已存在的
      # Release 只会补传新文件，不会剔掉旧的。所以同一个 tag 被推两次
      # （先推错 commit、删了再推），Release 底下就会同时躺着两个版本的 APK
      # —— 实测 2026-10-28 的 v1.5.42 下面就同时有 1.5.40 和 1.5.42，
      # 而且旧的排在前面。客户端按附件名挑最高版本能挡住，但人点 Release
      # 页面就会下错。发布前先把本 Release 已有的 .apk 附件清干净。
      - name: 清掉本 Release 已有的 APK 附件
        if: startsWith(github.ref, 'refs/tags/v') && steps.guard.outputs.build == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IDS=$(gh release view "$TAG" --json assets \
                -q '.assets[] | select(.name | endswith(".apk")) | .databaseId' 2>/dev/null || true)
          for id in $IDS; do
            echo "删除旧附件 id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
      - name: 发 Release（仅打 tag 且确实构建过时）
        # 没有词图源码时不发 Release —— 否则会把 3.66 MB 的空壳包
        # 挂到 tag 上，覆盖本地传上去的 447 MB 真包（实测已发生过一次）。
        if: startsWith(github.ref, 'refs/tags/v') && steps.guard.outputs.build == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          name: v${{ steps.ver.outputs.name }}
          body: |
            专升本 App v${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）

            **手机安装**：点下方 APK 下载 → 打开安装。
            已装旧版可直接覆盖升级，学习进度保留（签名一致、版本号递增）。
          draft: false
          prerelease: false