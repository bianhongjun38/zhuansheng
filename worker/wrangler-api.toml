# zsb-api —— 学习进度同步 + 英语闯关排行榜
#
# 为什么选 D1 而不是 KV：KV 免费版「写入不同 key」只有 1000 次/天，
# 若按一行一个 key 存，一次全量同步就是 337 次写入，20 人里 3 个人就打完。
# D1 免费版 10 万行/天，还有 7 天 Time Travel 可以回滚。

name = "zsb-api"
main = "zsb-api.js"
compatibility_date = "2026-10-27"

[[d1_databases]]
binding = "DB"
database_name = "zsb-data"
database_id = "e60217b6-275c-40a0-92e5-ba8790c1bf57"

# 部署：
#   npx wrangler deploy
# 建表：
#   npx wrangler d1 execute zsb-data --remote --file=schema.sql
