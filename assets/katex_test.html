<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式渲染测试</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  body{background:#14161C;color:#E8EAF0;font-family:sans-serif;padding:14px;font-size:16px;line-height:1.75}
  .q{margin:0 0 18px;padding:10px 0;border-bottom:1px solid #2C313C}
  .id{color:#6B7282;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script>
const QS = [
  ["1", "设函数 $f(x)=\\frac{1}{2}(e^{x}-e^{-x})$，则 $f(x)$ 在区间 $(-\\infty,+\\infty)$ 上"],
  ["5", "微分方程 $y''-4y=0$ 的通解为"],
  ["9", "$\\lim_{x\\to 0}\\frac{e^{x}-1}{x}=$"],
  ["11", "已知 $A$ 为四阶方阵，且 $|A|=2$，则 $|2A^{-1}|=$"],
  ["13", "$\\lim_{x\\to 0}\\frac{x-\\tan x}{x^{3}}$"],
  ["15", "$\\int_{-4}^{4}|x|\\,e^{-x^{2}}\\,\\mathrm{d}x$"],
  ["16", "判断级数 $\\sum_{n=1}^{\\infty}(-1)^{n}\\frac{n+3}{n^{2}+2n}$ 的敛散性"],
  ["17", "$\\iint_{D}(x^{2}+y^{2})\\,\\mathrm{d}x\\mathrm{d}y$，其中 $D=\\{(x,y)\\mid x^{2}+y^{2}\\le a^{2},\\ y\\ge 0,\\ a>0\\}$"],
  ["21", "求证 $\\int_{-a}^{0}f(x)\\,\\mathrm{d}x=\\int_{0}^{a}f(-x)\\,\\mathrm{d}x$"]
];
const root = document.getElementById('root');
let ok = 0, bad = [];
for (const [id, tex] of QS) {
  const d = document.createElement('div');
  d.className = 'q';
  try {
    d.innerHTML = '<span class="id">#' + id + '</span><br>' +
      tex.replace(/\$([^$]+)\$/g, (m, f) => katex.renderToString(f, {throwOnError: true, displayMode: false}));
    ok++;
  } catch (e) {
    bad.push(id + ': ' + e.message);
    d.textContent = id + ' 渲染失败';
  }
  root.appendChild(d);
}
document.title = 'OK=' + ok + ' BAD=' + bad.length;
window.__result = {ok: ok, bad: bad};
</script>
</body>
</html>
