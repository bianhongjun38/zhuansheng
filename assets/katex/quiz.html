<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #14161C;
    color: #E8EAF0;
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  #wrap { padding: 16px 16px 100px; }

  .bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(20,22,28,.96);
    display: flex; align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #2C313C;
    z-index: 10;
  }
  .bar .title { font-size: 15px; font-weight: 600; color: #E8EAF0; flex: 1; }
  .bar .count { font-size: 13px; color: #6B7282; font-variant-numeric: tabular-nums; }
  .bar .count b { color: #2FA8A0; }
  .bar .close {
    width: 40px; height: 40px; margin-right: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #A8AEBC;
  }
  #spacer { height: 52px; }

  .qid { font-size: 12px; color: #6B7282; margin-bottom: 6px; }
  .stem {
    font-size: 16.5px;
    line-height: 1.85;
    color: #E8EAF0;
    margin-bottom: 18px;
    word-wrap: break-word;
  }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 14px;
    margin-bottom: 10px;
    border: 1.5px solid #2C313C;
    border-radius: 12px;
    background: #1C1F27;
    transition: border-color .12s, background .12s;
  }
  .opt .k {
    flex: 0 0 22px;
    font-weight: 700;
    color: #A8AEBC;
    font-size: 15px;
  }
  .opt .v { flex: 1; font-size: 15.5px; line-height: 1.7; word-wrap: break-word; }

  .opt.pick-right { border-color: #4BBF8A; background: rgba(75,191,138,.10); }
  .opt.pick-right .k { color: #4BBF8A; }
  .opt.pick-wrong { border-color: #E06B6B; background: rgba(224,107,107,.10); }
  .opt.pick-wrong .k { color: #E06B6B; }
  .opt.reveal { border-color: #4BBF8A; }
  .opt.reveal .k { color: #4BBF8A; }
  .opt.dim { opacity: .45; }

  .verdict { margin: 16px 0 4px; font-size: 14.5px; font-weight: 600; }
  .verdict.ok { color: #4BBF8A; }
  .verdict.no { color: #E06B6B; }
  .verdict.miss { color: #E0A94A; }

  .sol {
    margin-top: 14px;
    padding: 14px;
    background: #1C1F27;
    border-left: 3px solid #7C6CF0;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.9;
    color: #C3C9D6;
  }
  .sol .h { color: #7C6CF0; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .sol .step { margin: 7px 0; }
  .tip {
    margin-top: 12px;
    padding: 11px 13px;
    background: rgba(224,169,74,.10);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.75;
    color: #E0A94A;
  }
  .tip .h { font-weight: 600; font-size: 12.5px; margin-bottom: 4px; opacity: .85; }

  #next {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 60px;
    margin: 0;
    background: #262A34;
    color: #E8EAF0;
    border: none;
    border-top: 1px solid #2C313C;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
  }
  #next:active { background: #2F3440; }
  #next:disabled { opacity: .35; }

  .empty { text-align: center; color: #6B7282; padding: 60px 20px; font-size: 15px; }
  .katex { font-size: 1.06em; }
  .katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>
<div class="bar">
  <div class="close" id="close">✕</div>
  <div class="title" id="title">练习</div>
  <div class="count"><b id="cur">0</b>/<span id="tot">0</span></div>
</div>
<div id="spacer"></div>
<div id="wrap"><div class="empty">加载中…</div></div>
<button id="next" disabled>请选择</button>

<script src="katex.min.js"></script>
<script>
var QS = [];        // 题目数组
var I = 0;          // 当前题
var picked = -1;    // 本题已选
var right = 0;      // 答对数
var wrongList = []; // 答错题（回传 Java 进错题本）
var subject = '';

// ── LaTeX 渲染 ─────────────────────────────────────
// 支持 $...$（行内）与 $$...$$（行间）。KaTeX 失败时退化为原文，不炸整页。
function tex(s) {
  if (s == null) return '';
  s = String(s);
  // 行间公式
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, function (m, f) {
    try {
      return katex.renderToString(f, { displayMode: true, throwOnError: false });
    } catch (e) { return m; }
  });
  // 行内公式
  s = s.replace(/\$([^$\n]+?)\$/g, function (m, f) {
    try {
      return katex.renderToString(f, { throwOnError: false });
    } catch (e) { return m; }
  });
  // 换行
  s = s.replace(/\n/g, '<br>');
  return s;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 先转义 HTML，再渲染公式（公式里不会有裸 < >）
function render(s) {
  return tex(esc(s));
}

// ── 入口：Java 调用 ────────────────────────────────
function startQuiz(json, subj, ttl) {
  subject = subj || '';
  try {
    QS = JSON.parse(json) || [];
  } catch (e) {
    QS = [];
  }
  I = 0; right = 0; wrongList = []; picked = -1;
  document.getElementById('title').textContent = ttl || '练习';
  document.getElementById('tot').textContent = QS.length;
  if (!QS.length) {
    document.getElementById('wrap').innerHTML =
      '<div class="empty">这一科暂时没有题目</div>';
    document.getElementById('next').disabled = true;
    return;
  }
  show();
}

function show() {
  picked = -1;
  var q = QS[I];
  document.getElementById('cur').textContent = (I + 1);

  var html = '';
  if (q.y) html += '<div class="qid">' + q.y + ' 年真题' +
    (q.n ? ' · 第 ' + q.n + ' 题' : '') + '</div>';
  html += '<div class="stem">' + render(q.q) + '</div>';

  var opts = q.o || [];
  var keys = ['A', 'B', 'C', 'D', 'E', 'F'];
  for (var i = 0; i < opts.length; i++) {
    html += '<div class="opt" data-i="' + i + '">' +
      '<div class="k">' + keys[i] + '</div>' +
      '<div class="v">' + render(opts[i]) + '</div></div>';
  }
  html += '<div id="fb"></div>';
  document.getElementById('wrap').innerHTML = html;

  var els = document.querySelectorAll('.opt');
  for (var j = 0; j < els.length; j++) {
    els[j].addEventListener('click', onPick);
  }

  var nb = document.getElementById('next');
  nb.textContent = (I === QS.length - 1) ? '完成' : '下一题';
  nb.disabled = true;
}

function onPick(e) {
  if (picked >= 0) return;          // 已作答，忽略重复点击
  var el = e.currentTarget;
  var i = parseInt(el.getAttribute('data-i'), 10);
  picked = i;

  var q = QS[I];
  var a = (typeof q.a === 'number') ? q.a : -1;
  var els = document.querySelectorAll('.opt');

  // 取消全部 disabled 视觉、标出结果
  for (var j = 0; j < els.length; j++) {
    var k = parseInt(els[j].getAttribute('data-i'), 10);
    if (a >= 0) {
      if (k === a) els[j].classList.add('reveal');
      if (k === picked && picked !== a) els[j].classList.add('pick-wrong');
      if (k === picked && picked === a) els[j].classList.add('pick-right');
      if (k !== a && k !== picked) els[j].classList.add('dim');
    } else {
      if (k === picked) els[j].classList.add('pick-right');
    }
  }

  var fb = document.getElementById('fb');
  var head = '';
  if (a < 0) {
    // 没答案的题：不编造，如实说明
    head = '<div class="verdict miss">这道题暂未收录标准答案，先自己判断。</div>';
  } else if (picked === a) {
    right++;
    head = '<div class="verdict ok">答对了</div>';
  } else {
    head = '<div class="verdict no">答错了，正确答案是 ' +
      ['A','B','C','D','E','F'][a] + '。</div>';
    wrongList.push(q);
  }

  var solHtml = '';
  if (q.sol) {
    solHtml += '<div class="sol"><div class="h">解题步骤</div>' +
      render(q.sol) + '</div>';
  }
  if (q.tip) {
    solHtml += '<div class="tip"><div class="h">技巧</div>' +
      render(q.tip) + '</div>';
  }

  fb.innerHTML = head + solHtml;
  document.getElementById('next').disabled = false;

  // 通知 Java（错题入库）
  if (a >= 0 && picked !== a && window.Native && Native.onWrong) {
    try { Native.onWrong(q.id || '', subject, (q.q || '').slice(0, 120)); } catch (e) {}
  }
}

document.getElementById('next').addEventListener('click', function () {
  if (I < QS.length - 1) {
    I++;
    show();
    window.scrollTo(0, 0);
  } else {
    finish();
  }
});

function finish() {
  var total = QS.length;
  var rate = total ? Math.round(right * 100 / total) : 0;
  var html = '<div class="qid">本轮完成</div>' +
    '<div class="stem" style="font-size:20px;font-weight:700">答对 ' + right +
    ' / ' + total + '</div>' +
    '<div class="sol" style="border-left-color:#4BBF8A">' +
    '<div class="h" style="color:#4BBF8A">正确率</div>' + rate + '%</div>';
  if (wrongList.length) {
    html += '<div class="tip"><div class="h">已记录</div>错的 ' + wrongList.length +
      ' 题已进错题本，去「错题库」可以重做。</div>';
  } else if (total) {
    html += '<div class="verdict ok">全部答对，这组可以过了。</div>';
  }
  document.getElementById('wrap').innerHTML = html;
  document.getElementById('cur').textContent = total;
  var nb = document.getElementById('next');
  nb.textContent = '关闭';
  nb.disabled = false;
  nb.onclick = function () {
    if (window.Native && Native.onFinish) {
      try { Native.onFinish(right, total); } catch (e) {}
    }
  };
  if (window.Native && Native.onFinish) {
    try { Native.onFinish(right, total); } catch (e) {}
  }
  window.scrollTo(0, 0);
}

document.getElementById('close').addEventListener('click', function () {
  if (window.Native && Native.onFinish) {
    try { Native.onFinish(right, QS.length); } catch (e) {}
  }
});

// 阻止双击缩放
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
